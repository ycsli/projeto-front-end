<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre-se - Paws & Code</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">
      <h1>Paws & Code</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html" class="active">Quero Ajudar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Seja um Colaborador</h2>
      <p>Preencha os dados abaixo para se juntar à nossa rede de voluntários.</p>

      <form action="#" method="POST" id="form-cadastro">
        <fieldset>
          <legend>Identificação Pessoal</legend>

          <div class="field-group">
            <label for="nome">Nome Completo:*</label>
            <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome">
          </div>

          <div class="field-group">
            <label for="email">E-mail:*</label>
            <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
          </div>

          <div class="field-group">
            <label for="cpf">CPF:*</label>
            <input 
              type="text" 
              id="cpf" 
              name="cpf" 
              required 
              maxlength="14" 
              inputmode="numeric"
              pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
              placeholder="000.000.000-00"
              title="Digite o CPF no formato 000.000.000-00"
            >
          </div>

          <div class="field-group">
            <label for="telefone">Telefone:*</label>
            <input 
              type="tel" 
              id="telefone" 
              name="telefone" 
              required 
              maxlength="15" 
              inputmode="tel"
              pattern="\(\d{2}\) \d{4,5}-\d{4}"
              placeholder="(00) 00000-0000"
              title="Digite o telefone no formato (00) 00000-0000"
            >
          </div>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <div class="field-group">
            <label for="cep">CEP:*</label>
            <input 
              type="text" 
              id="cep" 
              name="cep" 
              required 
              maxlength="9" 
              inputmode="numeric"
              pattern="\d{5}-\d{3}"
              placeholder="00000-000"
              title="Digite o CEP no formato 00000-000"
            >
          </div>
        </fieldset>

        <fieldset>
          <legend>Como quer contribuir?</legend>

          <div class="field-group">
            <label for="area">Área de Interesse:*</label>
            <select id="area" name="area" required>
              <option value="">Selecione uma área...</option>
              <option value="resgate">Resgate e Lar Temporário</option>
              <option value="desenvolvimento">Desenvolvimento / TI</option>
              <option value="eventos">Apoio em Eventos / Feiras</option>
              <option value="divulgacao">Redes Sociais e Design</option>
            </select>
          </div>
        </fieldset>

        <button type="submit" class="btn">Enviar Cadastro</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Paws & Code - Projeto Acadêmico sem fins lucrativos.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
